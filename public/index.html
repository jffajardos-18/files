<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Hot Companies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    :root{
      color-scheme: light;

      /* Core palette — unchanged */
      --navy:  #162780;
      --royal: #002AD8;
      --aqua:  #92F6FF;
      --cyan:  #00CCCC;
      --teal:  #015958;

      /* Neutrals — unchanged */
      --bg:    #FFFFFF;
      --ink:   #000000;
      --muted: #4a4a4a;
      --gray:  #808080;
      --line:  #E6E6E6;

      --radius: 12px;

      --serif:   'Lora', Georgia, 'Times New Roman', serif;
      --sans:    system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      --display: 'Playfair Display', Georgia, serif;
    }

    html{
      background: var(--bg);
      color: var(--ink);
      height: 100%;
    }

    body{
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.65;
    }

    a{ color: inherit; text-decoration: none; }
    a:hover{ text-decoration: underline; }
    *{ box-sizing: border-box; }

    /* ── Topbar ────────────────────────────────────────────── */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--navy);
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.12);
      font-family: var(--sans);
    }

    .topbar-inner{
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 32px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .brand{
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand h1{
      margin: 0;
      font-family: var(--display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.1px;
    }

    .brand .sub{
      font-size: 11px;
      color: rgba(255,255,255,.65);
      white-space: nowrap;
      letter-spacing: .1px;
    }

    .controls{
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .input{
      background: #fff;
      color: #000;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      min-width: 280px;
      outline: none;
      font-family: var(--sans);
      font-size: 13px;
    }
    .input:focus{
      border-color: var(--royal);
      box-shadow: 0 0 0 2px rgba(0,42,216,.13);
    }

    .btn{
      border: 1px solid rgba(255,255,255,.2);
      background: transparent;
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: .15px;
      font-family: var(--sans);
    }
    .btn:hover{ border-color: rgba(255,255,255,.4); }

    .pill{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .15px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff;
      white-space: nowrap;
    }

    /* ── Main layout ────────────────────────────────────────── */
    .main{
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 40px;
    }

    @media (max-width: 720px){
      .main{ padding: 22px 18px; }
      .topbar-inner{ padding: 12px 18px; }
    }

    .meta-row{
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin: 0 0 28px;
    }

    .meta{
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-family: var(--sans);
    }

    .meta a{
      color: var(--navy);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .error{
      color: #b00020;
      font-size: 13px;
      white-space: pre-wrap;
      border: 1px solid #f1c4cb;
      background: #fff5f6;
      padding: 12px 16px;
      border-radius: var(--radius);
      display: none;
      font-family: var(--sans);
    }

    /* ── Card grid ──────────────────────────────────────────── */
    .grid{
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .card{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    /* ── Card header ────────────────────────────────────────── */
    .card-head{
      padding: 24px 26px 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }

    .titleblock{
      min-width: 260px;
      flex: 1 1 520px;
    }

    .title-row{
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .company{
      margin: 0;
      font-family: var(--display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.25px;
      color: var(--ink);
      line-height: 1.2;
    }

    .tx-date{
      margin-top: 6px;
      font-family: var(--sans);
      font-size: 11px;
      color: var(--gray);
      letter-spacing: .25px;
      text-transform: uppercase;
    }

    .card-meta{
      margin-top: 8px;
      font-family: var(--sans);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .field-label{
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--gray);
      font-weight: 500;
      font-family: var(--sans);
    }

    .badges{
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge{
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid transparent;
      letter-spacing: .3px;
      white-space: nowrap;
      font-family: var(--sans);
      text-transform: uppercase;
    }

    .badge.label-HOT    { background: var(--royal); color: #fff; }
    .badge.label-WARM   { background: var(--teal);  color: #fff; }
    .badge.label-COLD   { background: var(--gray);  color: #fff; }
    .badge.label-NOISE  { background: var(--aqua);  color: var(--navy); border-color: rgba(22,39,128,.2); }
    .badge.label-UNKNOWN{ background: #f3f3f3; color: #000; border-color: var(--line); }

    .badge.metric{
      background: #fff;
      border-color: var(--line);
      color: var(--navy);
    }

    .links{
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex: 0 0 auto;
    }

    .chip{
      display: inline-flex;
      gap: 6px;
      align-items: center;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
      text-decoration: none;
      font-family: var(--sans);
      letter-spacing: .1px;
    }
    .chip:hover{
      border-color: rgba(0,42,216,.35);
      text-decoration: none;
    }

    /* ── KV grid ────────────────────────────────────────────── */
    .kv{
      padding: 18px 26px 22px;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 1100px){
      .kv{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 720px){
      .kv{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .kv-item{
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }
    .kv-k{
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .35px;
      text-transform: uppercase;
      margin-bottom: 5px;
      font-family: var(--sans);
    }
    .kv-v{
      font-size: 14px;
      font-weight: 600;
      color: #000;
      word-break: break-word;
      font-family: var(--sans);
    }

    /* ── Score bars ─────────────────────────────────────────── */
    .bars{
      padding: 0 26px 22px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 720px){
      .bars{ grid-template-columns: 1fr; }
    }

    .barbox{
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
    }

    .bar-top{
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .bar-k{
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .35px;
      font-family: var(--sans);
    }
    .bar-v{
      font-size: 13px;
      font-weight: 600;
      color: #000;
      white-space: nowrap;
      font-family: var(--sans);
    }

    .bar{
      margin-top: 8px;
      height: 5px;
      border-radius: 999px;
      background: #f2f2f2;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .bar-fill{
      height: 100%;
      width: 0%;
      background: var(--royal);
    }
    .bar-fill.teal{ background: var(--teal); }

    /* ── Collapsible sections ───────────────────────────────── */
    details.section{
      border-top: 1px solid var(--line);
      background: #fff;
    }

    details.section > summary{
      list-style: none;
      padding: 15px 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 600;
      font-size: 13px;
      color: var(--navy);
      user-select: none;
      font-family: var(--sans);
      letter-spacing: .05px;
    }
    details.section > summary::-webkit-details-marker{ display: none; }

    .section-meta{
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      font-style: italic;
      font-family: var(--serif);
    }

    .section-body{
      padding: 0 26px 24px;
      color: #000;
    }

    /* ── Editorial elements ─────────────────────────────────── */
    .pull-quote{
      margin: 4px 0 14px;
      padding: 12px 16px;
      border-left: 2px solid var(--navy);
      font-style: italic;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      background: #fafafa;
      border-radius: 0 6px 6px 0;
    }

    .analyst-note{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .attr{
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .45px;
      color: var(--gray);
      font-weight: 500;
      font-family: var(--sans);
      font-style: normal;
    }

    .small{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }

    .subhead{
      margin: 20px 0 8px;
      font-weight: 500;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .45px;
      font-family: var(--sans);
    }

    .list{
      margin: 8px 0 0;
      padding-left: 18px;
      color: #000;
      font-size: 14px;
      line-height: 1.65;
    }
    .list li{ margin: 8px 0; }

    .src-grid{
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .src-item{
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
    }

    .src-title{
      font-weight: 500;
      font-size: 13px;
      color: var(--ink);
      margin-bottom: 3px;
      word-break: break-word;
      font-family: var(--sans);
    }

    .src-why{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .chips{
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 10px 0 4px;
    }

    .mini{
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      font-family: var(--sans);
      letter-spacing: .1px;
    }

    /* ── Load more / footer ─────────────────────────────────── */
    .loadmore{
      margin: 28px 0 0;
      display: flex;
      justify-content: center;
    }

    .loadmore button{
      background: var(--royal);
      border: 1px solid rgba(0,42,216,.2);
      color: #fff;
      padding: 11px 28px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .15px;
      font-family: var(--sans);
    }
    .loadmore button:hover{ background: #001fb0; }

    .footer-note{
      margin: 30px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      font-family: var(--sans);
    }

    /* ── Priority breakdown ─────────────────────────────────── */
    .bd-head{ margin-bottom: 2px; }
    .bd-big{
      font-family: var(--display);
      font-size: 32px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -1px;
      line-height: 1.1;
    }
    .bd-big-unit{
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .bd-desc{
      font-family: var(--serif);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      margin-top: 4px;
    }

    .bd-tiles{
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 2px;
    }
    @media (max-width: 600px){ .bd-tiles{ grid-template-columns: repeat(2, 1fr); } }

    .bd-tile{
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
    }
    .bd-tile.high{ border-color: rgba(1,89,88,.25); }
    .bd-tile.low { border-color: rgba(128,128,128,.2); background: #fcfcfc; }
    .bd-tile-label{
      font-family: var(--sans);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .35px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 3px;
    }
    .bd-tile-score{
      font-family: var(--display);
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -.25px;
      line-height: 1.15;
    }
    .bd-tile.high .bd-tile-score{ color: var(--teal); }
    .bd-tile.low  .bd-tile-score{ color: var(--gray); }
    .bd-tile-why{
      font-family: var(--serif);
      font-size: 12px;
      font-style: italic;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.4;
    }
    .bd-tile-detail{
      font-family: var(--sans);
      font-size: 10.5px;
      color: var(--gray);
      margin-top: 2px;
      letter-spacing: .1px;
    }

    .bd-comps{
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }
    .bd-comp{
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 10px;
      align-items: start;
    }
    .bd-comp-pts{
      font-family: var(--display);
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      text-align: right;
      line-height: 1.2;
      padding-top: 1px;
    }
    .bd-comp-max{
      font-size: 10px;
      font-weight: 400;
      color: var(--gray);
      font-family: var(--sans);
    }
    .bd-comp-body{ min-width: 0; }
    .bd-comp-top{
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .bd-comp-name{
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink);
      font-weight: 500;
    }
    .bd-comp-wt{
      font-family: var(--sans);
      font-size: 10px;
      color: var(--gray);
      letter-spacing: .15px;
    }
    .bd-comp-bar{
      height: 4px;
      border-radius: 999px;
      background: #f2f2f2;
      border: 1px solid var(--line);
      overflow: hidden;
      margin: 4px 0 3px;
    }
    .bd-comp-fill{
      height: 100%;
      border-radius: 999px;
      background: var(--royal);
    }
    .bd-comp-fill.zero{ background: var(--line); }
    .bd-comp-calc{
      font-family: var(--serif);
      font-size: 12px;
      font-style: italic;
      color: var(--gray);
      line-height: 1.35;
    }

    .bd-engage{ margin-top: 2px; }
    .bd-engage-row{
      font-family: var(--sans);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.65;
    }
    .bd-engage-key{
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .3px;
      font-weight: 500;
      color: var(--gray);
      margin-right: 6px;
    }
    .bd-engage-note{
      font-size: 12px;
      color: var(--gray);
    }

    .bd-gates{
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .bd-gate{
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
    }
    .bd-gate.pass{ border-color: var(--teal); color: var(--teal); background: rgba(1,89,88,.04); }
    .bd-gate.warn{ border-color: #b87a00; color: #b87a00; background: #fffbf0; }
    .bd-gate.fail{ border-color: #b00020; color: #b00020; background: #fff5f6; }

  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Hot Companies — Company Profiles</h1>
        <div class="sub" id="subtitle">Sorted by hot_score ↓ then company_priority_test ↓</div>
      </div>

      <div class="controls">
        <span class="pill" id="status">Loading…</span>
        <input class="input" id="q" placeholder="Search companies, reasons, sources, HQ, industry…" />
        <button class="btn" id="clearBtn" type="button">Clear</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="meta-row">
      <div class="meta">
        Source:
        <a id="srcLink" target="_blank" rel="noopener"></a>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="error" id="err"></div>

    <div class="grid" id="cards"></div>

    <div class="loadmore" id="loadMoreWrap" style="display:none;">
      <button type="button" id="loadMoreBtn">Load more</button>
    </div>

    <div class="footer-note">
      Notes: Only the requested columns are displayed. Profiles are rendered in batches for performance.
    </div>
  </div>

<script>
(() => {
  // ---- IMPORTANT FIX ----
  // Your Pages root sometimes flips between:
  //   /<repo>/  (serving gh-pages /(root))  -> CSV at /<repo>/public/data/hot_companies.csv
  //   /<repo>/  (serving gh-pages /public) -> CSV at /<repo>/data/hot_companies.csv
  // We auto-detect which one exists so it never breaks again.

  const PATH_ROOT = (() => {
    const parts = window.location.pathname.split("/").filter(Boolean);
    // On *.github.io project pages, first segment is the repo name.
    if (window.location.hostname.endsWith("github.io") && parts.length) return "/" + parts[0];
    return "";
  })();

  const CSV_CANDIDATES = [
    `${PATH_ROOT}/public/data/hot_companies.csv`,
    `${PATH_ROOT}/data/hot_companies.csv`
  ];

  let CSV_URL = CSV_CANDIDATES[0]; // will be replaced by the first working candidate

  const IMPORTANT_COLUMNS = [
    "company_name",
    "norm_company_website",
    "norm_company_linkedin",
    "hq",
    "ownership",
    "l1_proxi",
    "industry_proxi",
    "fte",
    "fte_growth",
    "transaction_date",
    "transaction_type",
    "n_ai_survey",
    "max_ai_survey_score",
    "is_published_on_origin",
    "n_competitors",
    "pa_batch",
    "n_project_index",
    "company_priority_test",
    "hot_score",
    "arguments",
    "mna_signal_snippets",
    "origin_id",
    "company_priority_test_breakdown"
  ];

  const srcLink = document.getElementById("srcLink");
  const statusEl = document.getElementById("status");
  const metaEl = document.getElementById("meta");
  const errEl = document.getElementById("err");
  const cardsEl = document.getElementById("cards");
  const qEl = document.getElementById("q");
  const clearBtn = document.getElementById("clearBtn");
  const loadMoreWrap = document.getElementById("loadMoreWrap");
  const loadMoreBtn = document.getElementById("loadMoreBtn");

  let all = [];       // sorted full dataset
  let filtered = [];  // filtered in the same sorted order

  function setStatus(text){ statusEl.textContent = text; }
  function showError(msg){
    errEl.style.display = "block";
    errEl.textContent = msg;
  }
  function clearError(){
    errEl.style.display = "none";
    errEl.textContent = "";

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function safeJsonParse(s){
    const t = String(s ?? "").trim();
    if (!t) return null;
    try { return JSON.parse(t); } catch { return null; }
  }

  function asNum(s){
    const n = Number(String(s ?? "").trim());
    return Number.isFinite(n) ? n : null;
  }

  function boolish(v){
    const s = String(v ?? "").trim().toLowerCase();
    if (!s) return null;
    return (s === "true" || s === "t" || s === "1" || s === "yes" || s === "y");
  }

  function normalizeUrl(u){
    const s = String(u ?? "").trim();
    if (!s) return "";
    if (s.startsWith("http://") || s.startsWith("https://")) return s;
    return "https://" + s;
  }

  function fmtNum(n, digits=2){
    if (n === null || n === undefined || !Number.isFinite(n)) return "";
    return n.toFixed(digits);
  }

  function clamp01(n){
    if (!Number.isFinite(n)) return 0;
    return Math.max(0, Math.min(1, n));
  }

  // Robust-ish CSV parser: handles quoted fields, commas, newlines in quotes.
  function parseCSV(text){
    const out = [];
    let i = 0, field = "", row = [];
    let inQuotes = false;

    while (i < text.length){
      const c = text[i];

      if (inQuotes){
        if (c === '"'){
          if (text[i + 1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === ","){ row.push(field); field = ""; i++; continue; }
        if (c === "\r"){ i++; continue; }
        if (c === "\n"){ row.push(field); out.push(row); field = ""; row = []; i++; continue; }
        field += c; i++; continue;
      }
    }
    row.push(field);
    out.push(row);
    return out;
  }

  function buildIndex(headers){
    const map = new Map();
    headers.forEach((h, idx) => map.set(String(h ?? "").trim(), idx));
    return map;
  }

  function getCell(row, idxMap, key){
    const idx = idxMap.get(key);
    if (idx === undefined) return "";
    return row[idx] ?? "";
  }

  function labelFromArguments(arg){
    const raw = arg?.label;
    return raw ? String(raw).toUpperCase() : "UNKNOWN";
  }

  function buildSearchBlob(r){
    const parts = [];

    for (const k of IMPORTANT_COLUMNS){
      if (k === "arguments" || k === "mna_signal_snippets") continue;
      parts.push(String(r[k] ?? ""));
    }

    if (r._arguments){
      parts.push(String(r._arguments.label ?? ""));
      parts.push(String(r._arguments.summary ?? ""));
      parts.push(String(r._arguments.deal_stage ?? ""));
      parts.push(String(r._arguments.deal_role ?? ""));
      parts.push(String(r._arguments.counterparty ?? ""));
      parts.push(String(r._arguments.agent_analyst_comment ?? ""));
      const reasons = Array.isArray(r._arguments.reasons) ? r._arguments.reasons : [];
      for (const rr of reasons){
        parts.push(String(rr?.text ?? ""));
        parts.push(String(rr?.source_url ?? ""));
      }
      const sources = Array.isArray(r._arguments.sources) ? r._arguments.sources : [];
      for (const ss of sources){
        parts.push(String(ss?.title ?? ""));
        parts.push(String(ss?.url ?? ""));
        parts.push(String(ss?.why ?? ""));
      }
    }

    if (r._mna){
      parts.push(String(r._mna.website ?? ""));
      parts.push(String(r._mna.base_root ?? ""));
      parts.push(String(r._mna.company_name ?? ""));
      const msrc = Array.isArray(r._mna.sources) ? r._mna.sources : [];
      for (const s of msrc){
        parts.push(String(s?.title ?? ""));
        parts.push(String(s?.final_url ?? s?.requested_url ?? ""));
        parts.push(String(s?.source_type ?? ""));
      }
    }

    return parts.join(" ").toLowerCase();
  }

  function priorityBreakdownHTML(bd){
    if (!bd) return '<div class="small">No breakdown available.</div>';

    const inp  = bd.inputs || {};
    const norm = bd.normalized || {};
    const comps = bd.b_components || {};

    const p = v => (v == null || !Number.isFinite(v)) ? "\u2014" : Math.round(v * 100) + "%";

    // ── 1. Headline ──────────────────────────────────────────
    const finalPct = Math.round((bd.priority_final ?? 0) * 100);
    const basePts  = Math.round((bd.b_score ?? 0) * 100);
    const boostPts = bd.e_ind
      ? Math.max(0, Math.round(((bd.priority_raw ?? 0) - (bd.b_score ?? 0)) * 100))
      : 0;

    let descParts = [];
    if (bd.z_mult === 0) {
      descParts.push("Gated to zero \u2014 ownership is " + (norm.ownership_norm || "excluded"));
    } else {
      descParts.push("Base " + basePts + " out of 100");
      if (boostPts > 0) descParts.push("engagement adds +" + boostPts);
      const pp = [];
      if ((bd.penalty_ownership_mult ?? 1) < 1) pp.push("missing ownership (\u00d70.5)");
      if ((bd.penalty_recent_mult ?? 1) < 1) pp.push("recent transaction (\u00d70.5)");
      descParts.push(pp.length ? "penalties: " + pp.join(", ") : "no penalties");
    }

    const headlineHTML = `
      <div class="bd-head">
        <div class="bd-big">${finalPct}<span class="bd-big-unit">%</span></div>
        <div class="bd-desc">${esc(descParts.join(". ") + ".")}</div>
      </div>`;

    // ── 2. Input factor tiles ────────────────────────────────

    // Growth (G)
    let growthWhy = "";
    if (inp.fte != null && inp.fte_growth != null) {
      const bk = inp.fte >= 1000 ? "1,000+" : inp.fte >= 500 ? "500\u2013999"
        : inp.fte >= 200 ? "200\u2013499" : inp.fte >= 100 ? "100\u2013199"
        : inp.fte >= 50 ? "50\u201399" : "< 50";
      growthWhy = Number(inp.fte).toLocaleString() + " FTE (" + bk + "), "
        + Math.round(inp.fte_growth * 100) + "% growth";
    } else {
      growthWhy = inp.fte_growth == null ? "No growth data" : Math.round((inp.fte_growth ?? 0) * 100) + "% growth";
    }

    // Industry tier (industry1_score)
    const i1S = bd.industry1_score;
    const tier = i1S >= 1 ? "Tier 1 (highest)" : i1S >= 0.8 ? "Tier 2"
      : i1S >= 0.7 ? "Tier 3" : i1S >= 0.6 ? "Tier 4" : "unranked";
    const i1Why = (inp.industry_proxi || "Unknown") + " \u2014 " + tier;

    // Industry heat (industry2_score)
    const deepH  = norm.heat_deep_norm;
    const proxiH = norm.heat_l2_proxi_norm;
    let i2Why = "", i2Path = "";
    if (deepH === "very hot" || deepH === "hot") {
      const lvl = inp.l4 ? "L4" : inp.l3 ? "L3" : inp.l2 ? "L2" : "L1";
      const val = inp.l4 || inp.l3 || inp.l2 || inp.l1 || "\u2014";
      i2Why  = deepH + " via deep taxonomy";
      i2Path = lvl + ": " + val;
    } else if (proxiH) {
      i2Why  = proxiH + " via industry_proxi fallback";
      i2Path = (inp.l1_proxi || "?") + " \u2192 " + (inp.industry_proxi || "?");
    } else {
      i2Why = "No taxonomy match";
    }

    // HQ & Geography
    const hqOnly  = bd.hq_only_score ?? 0;
    const geoOnly = bd.geo_only_score ?? 0;
    let hqWhy = "";
    if (hqOnly > 0 && hqOnly >= geoOnly) {
      hqWhy = (inp.hq || "?") + " \u2014 " + (hqOnly >= 1 ? "US / Canada (full match)" : "European HQ market");
    } else if (geoOnly > 0) {
      hqWhy = (inp.geography || "?") + " \u2014 Americas / Europe region";
    } else {
      hqWhy = "Outside target geography";
    }

    // Projects
    const nProj = inp.n_project ?? 0;
    const pWhy = nProj + " project" + (nProj !== 1 ? "s" : "")
      + (bd.p_index != null ? ", index " + p(bd.p_index) : "");

    // Competitors
    const nComp = inp.n_competitors ?? 0;
    const kWhy = nComp + " competitor" + (nComp !== 1 ? "s" : "") + " (log-normalised)";

    const factors = [
      { label: "Growth",          score: bd.g_score,        why: growthWhy },
      { label: "Industry tier",   score: i1S,               why: i1Why },
      { label: "Industry heat",   score: bd.industry2_score, why: i2Why, detail: i2Path },
      { label: "HQ & Geography",  score: bd.hq_geo_score,   why: hqWhy },
      { label: "Project activity", score: bd.p_index,        why: pWhy },
      { label: "Competitors",     score: bd.k_index,         why: kWhy },
    ];

    const tilesHTML = factors.map(f => {
      const v   = f.score ?? 0;
      const cls = v >= 0.9 ? " high" : v <= 0.05 ? " low" : "";
      return `
        <div class="bd-tile${cls}">
          <div class="bd-tile-label">${esc(f.label)}</div>
          <div class="bd-tile-score">${p(f.score)}</div>
          <div class="bd-tile-why">${esc(f.why)}</div>
          ${f.detail ? `<div class="bd-tile-detail">${esc(f.detail)}</div>` : ""}
        </div>`;
    }).join("");

    // ── 3. Base score composition ────────────────────────────
    const COMP_META = {
      g_x_industry2:      { wt: 50,  label: "Growth \u00d7 Industry heat", fkeys: ["g_score","industry2_score"] },
      g_x_industry1:      { wt: 10,  label: "Growth \u00d7 Industry tier", fkeys: ["g_score","industry1_score"] },
      g:                   { wt: 10,  label: "Growth alone",               fkeys: ["g_score"] },
      industry2:           { wt: 10,  label: "Industry heat alone",        fkeys: ["industry2_score"] },
      hq_geo:              { wt:  5,  label: "HQ & Geography alone",       fkeys: ["hq_geo_score"] },
      g_x_hq_geo:          { wt:  5,  label: "Growth \u00d7 HQ/Geo",      fkeys: ["g_score","hq_geo_score"] },
      industry2_x_hq_geo: { wt:  5,  label: "Industry heat \u00d7 HQ/Geo",fkeys: ["industry2_score","hq_geo_score"] },
      p_index:             { wt: 2.5, label: "Project activity",           fkeys: ["p_index"] },
      k_index:             { wt: 2.5, label: "Competitor signal",          fkeys: ["k_index"] },
    };

    const FSHORT = {
      g_score: "Growth", industry1_score: "Ind.\u2009tier",
      industry2_score: "Ind.\u2009heat", hq_geo_score: "HQ/Geo",
      p_index: "Projects", k_index: "Competitors",
    };

    const rawScores = {
      g_score: bd.g_score, industry1_score: bd.industry1_score,
      industry2_score: bd.industry2_score, hq_geo_score: bd.hq_geo_score,
      p_index: bd.p_index, k_index: bd.k_index,
    };

    const compEntries = Object.entries(comps)
      .filter(([, v]) => typeof v === "number")
      .sort((a, b) => b[1] - a[1]);

    const maxComp = Math.max(...compEntries.map(([, v]) => v), 0.001);

    const compHTML = compEntries.length
      ? compEntries.map(([k, v]) => {
          const meta = COMP_META[k] || { wt: "?", label: k.replace(/_/g, " "), fkeys: [] };
          const barPct = Math.round((v / maxComp) * 100);
          const contribution = Math.round(v * 100);
          const maxPoss = meta.wt;
          const calcLine = (meta.fkeys || []).map(fk =>
            (FSHORT[fk] || fk) + " " + p(rawScores[fk])
          ).join(" \u00d7 ");
          return `
            <div class="bd-comp">
              <div class="bd-comp-pts">${contribution}<span class="bd-comp-max">/${maxPoss}</span></div>
              <div class="bd-comp-body">
                <div class="bd-comp-top">
                  <span class="bd-comp-name">${esc(meta.label)}</span>
                  <span class="bd-comp-wt">${meta.wt}% weight</span>
                </div>
                <div class="bd-comp-bar"><div class="bd-comp-fill${v === 0 ? " zero" : ""}" style="width:${barPct}%"></div></div>
                ${calcLine ? `<div class="bd-comp-calc">${esc(calcLine)}</div>` : ""}
              </div>
            </div>`;
        }).join("")
      : '<div class="small">\u2014</div>';

    // ── 4. Engagement boost ──────────────────────────────────
    let engageHTML = "";
    if (bd.e_ind) {
      const reason = (nProj >= 2)
        ? (nProj + " projects \u2265 2 threshold")
        : ((norm.ownership_norm || "?") + " ownership qualifies");

      let alphaNote = "Base " + p(bd.alpha_base) + " from project index";
      if ((bd.k_index ?? 0) > 0) alphaNote += " + competitor signal";
      const own = (norm.ownership_norm || "").toUpperCase();
      if (nProj >= 2) {
        if (["PE-BACKED","VC-BACKED"].includes(own))  alphaNote += ", +25% PE/VC boost";
        else if (own === "ACQUIRED")                   alphaNote += ", +15% acquired boost";
        else if (own === "PRIVATELY-HELD")              alphaNote += ", +10% privately-held boost";
      } else {
        if (["PE-BACKED","VC-BACKED"].includes(own))  alphaNote += ", \u00d780% PE/VC adj.";
        else if (own === "ACQUIRED")                   alphaNote += ", \u00d770% acquired adj.";
        else if (own === "PRIVATELY-HELD")              alphaNote += ", \u00d765% privately-held adj.";
      }

      engageHTML = `
        <div class="bd-engage">
          <div class="bd-engage-row"><span class="bd-engage-key">Engaged</span> Yes \u2014 ${esc(reason)}</div>
          <div class="bd-engage-row"><span class="bd-engage-key">Alpha</span> ${p(bd.alpha)} <span class="bd-engage-note">(${esc(alphaNote)})</span></div>
          <div class="bd-engage-row"><span class="bd-engage-key">Effect</span> +${boostPts} pts added to base <span class="bd-engage-note">(\u03b1 \u00d7 remaining headroom)</span></div>
        </div>`;
    } else {
      engageHTML = '<div class="bd-engage"><div class="bd-engage-row">Not engaged \u2014 no boost applied.</div></div>';
    }

    // ── 5. Gates & penalties ─────────────────────────────────
    const gates = [];
    gates.push(bd.z_mult === 0
      ? { label: "Ownership gate", cls: "fail", text: "Blocked (" + (norm.ownership_norm || "?") + ")" }
      : { label: "Ownership gate", cls: "pass", text: "Pass" }
    );
    gates.push((bd.penalty_ownership_mult ?? 1) < 1
      ? { label: "Missing ownership", cls: "warn", text: "\u00d70.5 penalty" }
      : { label: "Ownership data", cls: "pass", text: "Present" }
    );
    gates.push((bd.penalty_recent_mult ?? 1) < 1
      ? { label: "Recent transaction", cls: "warn", text: "\u00d70.5 (< 1 year)" }
      : { label: "Transaction recency", cls: "pass", text: "No penalty" }
    );

    const gatesHTML = `
      <div class="bd-gates">
        ${gates.map(g => `<span class="bd-gate ${g.cls}">${esc(g.label)}: ${esc(g.text)}</span>`).join("")}
      </div>`;

    return `
      ${headlineHTML}
      <div class="subhead">What the model sees</div>
      <div class="bd-tiles">${tilesHTML}</div>
      <div class="subhead">Base score composition \u2014 ${basePts} / 100</div>
      <div class="bd-comps">${compHTML}</div>
      <div class="subhead">Engagement boost</div>
      ${engageHTML}
      <div class="subhead">Gates & penalties</div>
      ${gatesHTML}
    `;
  }

              <div class="bar-k">Company priority</div>
              <div class="bar-v">${pri == null ? "—" : esc(fmtNum(pri, 3))} (${priPct}%)</div>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${priPct}%;"></div></div>
          </div>
        </div>

        <details class="section" open>
          <summary>
            <span>Arguments</span>
            <span class="section-meta">${args?.deal_stage ? esc(args.deal_stage) : "—"}</span>
          </summary>
          <div class="section-body">
            ${argsSummary ? `<blockquote class="pull-quote">${esc(argsSummary)}</blockquote>` : ""}
            ${analyst ? `<div class="analyst-note"><span class="attr">Agent Analyst note —</span> ${esc(analyst)}</div>` : ""}

            <div class="chips">
              <span class="mini">deal_role: ${esc(args?.deal_role ?? "—")}</span>
              <span class="mini">deal_date: ${esc(args?.deal_date ?? "—")}</span>
              <span class="mini">counterparty: ${esc(args?.counterparty ?? "—")}</span>
            </div>

            <div class="subhead">Reasons</div>
            ${reasonHTML}

            <div class="subhead">Sources</div>
            ${sourceHTML}
          </div>
        </details>

        <details class="section">
          <summary>
            <span>Priority Score Breakdown</span>
            <span class="section-meta">${bd && bd.priority_final != null ? bd.priority_final.toFixed(3) : "—"}</span>
          </summary>
          <div class="section-body">
            ${priorityBreakdownHTML(bd)}
          </div>
        </details>

        <details class="section">
          <summary>
            <span>M&A Signal Snippets</span>
            <span class="section-meta">${esc(mna?.website ?? "")}</span>
          </summary>
          <div class="section-body">
            <div class="small">
              ${mna?.base_root ? `<span class="attr">Base</span>&thinsp;${esc(mna.base_root)}${mna?.retrieved_at_utc ? " &nbsp;·&nbsp; " : ""}` : ""}
              ${mna?.retrieved_at_utc ? `<span class="attr">Retrieved</span>&thinsp;${esc(mna.retrieved_at_utc)}` : ""}
            </div>

            <div class="subhead">Sources</div>
            ${mnaSourcesHTML}
          </div>
        </details>
      </div>
    `;
  }

  function render(){
    cardsEl.innerHTML = "";

    const showN = Math.min(renderLimit, filtered.length);
    const slice = filtered.slice(0, showN);

    cardsEl.innerHTML = slice.map(cardHTML).join("");

    metaEl.textContent =
      `Companies: ${filtered.length.toLocaleString()} / ${all.length.toLocaleString()} | Showing: ${showN.toLocaleString()} | Sorted: hot_score ↓, company_priority_test ↓`;

    if (showN < filtered.length){
      loadMoreWrap.style.display = "flex";
      loadMoreBtn.textContent = `Load more (${Math.min(RENDER_STEP, filtered.length - showN)})`;
    } else {
      loadMoreWrap.style.display = "none";
    }
  }

  function applyFilter(){
    const needle = qEl.value.trim().toLowerCase();
    renderLimit = 40;

    if (!needle){
      filtered = all;
    } else {
      filtered = all.filter(r => r._search.includes(needle));
    }
    render();
  }

  loadMoreBtn.addEventListener("click", () => {
    renderLimit += RENDER_STEP;
    render();
  });

  clearBtn.addEventListener("click", () => {
    qEl.value = "";
    applyFilter();
    qEl.focus();
  });

  qEl.addEventListener("input", () => applyFilter());

  async function fetchFirstOk(urls){
    let lastErr = null;
    for (const u of urls){
      try{
        const r = await fetch(u, { cache: "no-store" });
        if (r.ok) return { url: u, res: r };
        lastErr = new Error(`Fetch failed: ${r.status} ${r.statusText} (${u})`);
      } catch (e){
        lastErr = e;
      }
    }
    throw lastErr || new Error("Failed to fetch CSV.");
  }

  async function main(){
    try{
      clearError();
      setStatus("Locating CSV…");

      const { url, res } = await fetchFirstOk(CSV_CANDIDATES);
      CSV_URL = url;

      srcLink.href = CSV_URL;
      srcLink.textContent = CSV_URL;

      setStatus("Downloading CSV…");
      const text = await res.text();
      if (!text.trim()) throw new Error("CSV appears empty.");

      setStatus("Parsing…");
      const parsed = parseCSV(text);
      if (!parsed.length) throw new Error("CSV appears empty.");

      const headers = parsed[0].map(h => String(h ?? "").trim());
      const idxMap = buildIndex(headers);

      const records = [];
      for (const row of parsed.slice(1)){
        const r = {};
        for (const k of IMPORTANT_COLUMNS){
          r[k] = getCell(row, idxMap, k);
        }

        r._arguments = safeJsonParse(r.arguments);
        r._mna = safeJsonParse(r.mna_signal_snippets);
        r._breakdown = safeJsonParse(r.company_priority_test_breakdown);

        r._label = labelFromArguments(r._arguments);

        r._hot_score = asNum(r.hot_score);
        r._company_priority = asNum(r.company_priority_test);

        r._search = buildSearchBlob(r);

        records.push(r);
      }

      records.sort((a, b) => {
        const ah = (a._hot_score == null) ? -Infinity : a._hot_score;
        const bh = (b._hot_score == null) ? -Infinity : b._hot_score;
        if (bh !== ah) return bh - ah;

        const ap = (a._company_priority == null) ? -Infinity : a._company_priority;
        const bp = (b._company_priority == null) ? -Infinity : b._company_priority;
        if (bp !== ap) return bp - ap;

        const an = String(a.company_name ?? "");
        const bn = String(b.company_name ?? "");
        return an.localeCompare(bn);
      });

      all = records;
      filtered = all;

      setStatus("Ready");
      render();

    } catch (e){
      setStatus("Error");
      showError(String(e?.message || e));
    }
  }

  main();
})();
</script>
</body>
</html>
