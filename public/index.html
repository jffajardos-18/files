<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Hot Companies</title>

  <style>
    :root{
      color-scheme: light;

      /* Core palette (solid, no gradients) */
      --navy: #162780;   /* Pantone 2748 C */
      --royal: #002AD8;  /* Pantone 2728 C */
      --aqua: #92F6FF;   /* Pantone 635 C */
      --cyan: #00CCCC;   /* Pantone 3262 C */
      --teal: #015958;   /* Pantone 323 C */

      /* Neutrals */
      --bg: #FFFFFF;
      --ink: #000000;
      --muted: #4a4a4a;
      --gray: #808080;
      --line: #E6E6E6;

      --radius: 3px;
    }

    html{
      background: var(--bg);
      color: var(--ink);
      height: 100%;
    }

    body{
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a{ color: inherit; text-decoration: none; }
    a:hover{ text-decoration: underline; }
    *{ box-sizing: border-box; }

    /* ── Topbar ── */

    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--navy);
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .topbar-inner{
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 36px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .brand{
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .brand h1{
      margin: 0;
      font-size: 16px;
      letter-spacing: .01em;
      font-weight: 400;
      line-height: 1.25;
    }

    .brand .sub{
      font-size: 11px;
      color: rgba(255,255,255,.5);
      white-space: nowrap;
      font-weight: 400;
      letter-spacing: .04em;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .controls{
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .input{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
      color: #000;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 7px 12px;
      min-width: 280px;
      outline: none;
      font-size: 13px;
    }
    .input:focus{
      border-color: var(--royal);
      box-shadow: 0 0 0 2px rgba(0,42,216,.1);
    }

    .btn{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      border: 1px solid rgba(255,255,255,.18);
      background: transparent;
      color: rgba(255,255,255,.7);
      padding: 7px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .btn:hover{ border-color: rgba(255,255,255,.35); color: #fff; }

    .pill{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: var(--radius);
      font-size: 10px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.7);
      white-space: nowrap;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* ── Main container ── */

    .main{
      max-width: 960px;
      margin: 0 auto;
      padding: 52px 36px 72px;
    }

    .meta-row{
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin: 0 0 40px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .meta{
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: .01em;
    }

    .meta a{
      color: var(--navy);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .error{
      color: #b00020;
      font-size: 13px;
      white-space: pre-wrap;
      border: 1px solid #f1c4cb;
      background: #fff5f6;
      padding: 12px 16px;
      border-radius: var(--radius);
      display: none;
    }

    /* ── Card grid ── */

    .grid{
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .card{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .card-head{
      padding: 32px 36px 28px;
      display: flex;
      gap: 28px;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }

    .titleblock{
      min-width: 260px;
      flex: 1 1 560px;
    }

    .title-row{
      display: flex;
      gap: 14px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .dateline{
      margin: 0 0 12px;
      font-size: 11px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .company{
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -.025em;
      line-height: 1.15;
      color: var(--ink);
    }

    .deck{
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.7;
      max-width: 66ch;
      font-weight: 400;
    }

    .badges{
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: var(--radius);
      font-size: 10px;
      font-weight: 600;
      border: 1px solid transparent;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .badge.label-HOT{ background: var(--royal); color:#fff; }
    .badge.label-WARM{ background: var(--teal); color:#fff; }
    .badge.label-COLD{ background: var(--gray); color:#fff; }
    .badge.label-NOISE{ background: var(--aqua); color: var(--navy); border-color: rgba(22,39,128,.18); }
    .badge.label-UNKNOWN{ background: #f3f3f3; color: #000; border-color: var(--line); }

    .badge.metric{
      background: #fff;
      border-color: var(--line);
      color: var(--navy);
      font-weight: 600;
    }

    .links{
      display: flex;
      gap: 10px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex: 0 0 auto;
    }

    .links-group{
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip{
      display: inline-flex;
      gap: 6px;
      align-items: center;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      padding: 6px 10px;
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 500;
      text-decoration: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .chip:hover{
      border-color: rgba(0,42,216,.3);
      text-decoration: none;
    }

    .data-callout{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      min-width: 220px;
      background: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .data-callout .k{
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .data-callout .v{
      font-size: 13px;
      color: var(--ink);
      line-height: 1.45;
      font-weight: 500;
    }

    /* ── Narrative block ── */

    .narrative{
      padding: 28px 36px 32px;
      border-bottom: 1px solid var(--line);
    }

    .body-copy{
      font-size: 15px;
      color: var(--ink);
      max-width: 66ch;
      line-height: 1.75;
    }

    .pull-quote{
      margin: 22px 0 0;
      border-left: 2px solid var(--line);
      padding: 2px 0 2px 22px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.7;
      font-style: italic;
      max-width: 60ch;
    }

    .closing-line{
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
      max-width: 66ch;
      line-height: 1.65;
    }

    /* ── Key-value grid ── */

    .kv{
      padding: 28px 36px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 1100px){
      .kv{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px){
      .kv{ grid-template-columns: 1fr; }
    }

    .kv-item{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      background: #fff;
    }
    .kv-k{
      font-size: 10px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 7px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .kv-v{
      font-size: 14px;
      font-weight: 500;
      color: #000;
      word-break: break-word;
      line-height: 1.5;
    }

    /* ── Score bars ── */

    .bars{
      padding: 0 36px 28px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .barbox{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      background: #fff;
    }

    .bar-top{
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .bar-k{
      font-size: 10px;
      color: var(--muted);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .bar-v{
      font-size: 12px;
      font-weight: 500;
      color: #000;
      white-space: nowrap;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .bar{
      margin-top: 8px;
      height: 5px;
      border-radius: 999px;
      background: #f2f2f2;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .bar-fill{
      height: 100%;
      width: 0%;
      background: var(--royal);
    }
    .bar-fill.teal{ background: var(--teal); }

    /* ── Collapsible sections ── */

    details.section{
      border-top: 1px solid var(--line);
      background: #fff;
    }

    details.section > summary{
      list-style: none;
      padding: 18px 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 400;
      color: var(--navy);
      user-select: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    details.section > summary::-webkit-details-marker{ display:none; }

    .section-body{
      padding: 0 36px 28px;
      color: #000;
    }

    .small{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
    }

    .subhead{
      margin: 24px 0 10px;
      font-weight: 400;
      color: var(--ink);
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .list{
      margin: 8px 0 0;
      padding-left: 22px;
      color: #000;
      font-size: 14px;
      line-height: 1.7;
    }
    .list li{ margin: 8px 0; }

    .src-grid{
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .src-item{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      background: #fff;
    }

    .src-title{
      font-weight: 500;
      font-size: 13px;
      color: var(--ink);
      margin-bottom: 4px;
      word-break: break-word;
    }

    .src-why{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.65;
    }

    .chips{
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .mini{
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: var(--radius);
      font-size: 10px;
      font-weight: 500;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: .03em;
    }

    /* ── Load more & footer ── */

    .loadmore{
      margin: 28px 0 0;
      display: flex;
      justify-content: center;
    }

    .loadmore button{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--royal);
      border: 1px solid rgba(0,42,216,.25);
      color: #fff;
      padding: 9px 24px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .loadmore button:hover{ background: #001fb0; }

    .footer-note{
      margin: 44px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      letter-spacing: .01em;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Hot Companies — Company Profiles</h1>
        <div class="sub" id="subtitle">Sorted by hot_score ↓ then company_priority_test ↓</div>
      </div>

      <div class="controls">
        <span class="pill" id="status">Loading…</span>
        <input class="input" id="q" placeholder="Search companies, reasons, sources, HQ, industry…" />
        <button class="btn" id="clearBtn" type="button">Clear</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="meta-row">
      <div class="meta">
        Source:
        <a id="srcLink" target="_blank" rel="noopener"></a>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="error" id="err"></div>

    <div class="grid" id="cards"></div>

    <div class="loadmore" id="loadMoreWrap" style="display:none;">
      <button type="button" id="loadMoreBtn">Load more</button>
    </div>

    <div class="footer-note">
      Notes: Only the requested columns are displayed. Profiles are rendered in batches for performance.
    </div>
  </div>

<script>
(() => {
  // ---- IMPORTANT FIX ----
  // Your Pages root sometimes flips between:
  //   /<repo>/  (serving gh-pages /(root))  -> CSV at /<repo>/public/data/hot_companies.csv
  //   /<repo>/  (serving gh-pages /public) -> CSV at /<repo>/data/hot_companies.csv
  // We auto-detect which one exists so it never breaks again.

  const PATH_ROOT = (() => {
    const parts = window.location.pathname.split("/").filter(Boolean);
    // On *.github.io project pages, first segment is the repo name.
    if (window.location.hostname.endsWith("github.io") && parts.length) return "/" + parts[0];
    return "";
  })();

  const CSV_CANDIDATES = [
    `${PATH_ROOT}/public/data/hot_companies.csv`,
    `${PATH_ROOT}/data/hot_companies.csv`
  ];

  let CSV_URL = CSV_CANDIDATES[0]; // will be replaced by the first working candidate

  const IMPORTANT_COLUMNS = [
    "company_name",
    "norm_company_website",
    "norm_company_linkedin",
    "hq",
    "ownership",
    "l1_proxi",
    "industry_proxi",
    "fte",
    "fte_growth",
    "transaction_date",
    "transaction_type",
    "n_ai_survey",
    "max_ai_survey_score",
    "is_published_on_origin",
    "n_competitors",
    "pa_batch",
    "n_project_index",
    "company_priority_test",
    "hot_score",
    "arguments",
    "mna_signal_snippets",
    "origin_id"
  ];

  const srcLink = document.getElementById("srcLink");
  const statusEl = document.getElementById("status");
  const metaEl = document.getElementById("meta");
  const errEl = document.getElementById("err");
  const cardsEl = document.getElementById("cards");
  const qEl = document.getElementById("q");
  const clearBtn = document.getElementById("clearBtn");
  const loadMoreWrap = document.getElementById("loadMoreWrap");
  const loadMoreBtn = document.getElementById("loadMoreBtn");

  let all = [];       // sorted full dataset
  let filtered = [];  // filtered in the same sorted order
  let renderLimit = 40;
  const RENDER_STEP = 40;

  function setStatus(text){ statusEl.textContent = text; }
  function showError(msg){
    errEl.style.display = "block";
    errEl.textContent = msg;
  }
  function clearError(){
    errEl.style.display = "none";
    errEl.textContent = "";
  }

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function safeJsonParse(s){
    const t = String(s ?? "").trim();
    if (!t) return null;
    try { return JSON.parse(t); } catch { return null; }
  }

  function asNum(s){
    const n = Number(String(s ?? "").trim());
    return Number.isFinite(n) ? n : null;
  }

  function boolish(v){
    const s = String(v ?? "").trim().toLowerCase();
    if (!s) return null;
    return (s === "true" || s === "t" || s === "1" || s === "yes" || s === "y");
  }

  function normalizeUrl(u){
    const s = String(u ?? "").trim();
    if (!s) return "";
    if (s.startsWith("http://") || s.startsWith("https://")) return s;
    return "https://" + s;
  }

  function fmtNum(n, digits=2){
    if (n === null || n === undefined || !Number.isFinite(n)) return "";
    return n.toFixed(digits);
  }

  function fmtDate(raw){
    const s = String(raw ?? "").trim();
    if (!s) return "";
    const d = new Date(s);
    if (Number.isNaN(d.getTime())) return s;
    return d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  }

  function clamp01(n){
    if (!Number.isFinite(n)) return 0;
    return Math.max(0, Math.min(1, n));
  }

  // Robust-ish CSV parser: handles quoted fields, commas, newlines in quotes.
  function parseCSV(text){
    const out = [];
    let i = 0, field = "", row = [];
    let inQuotes = false;

    while (i < text.length){
      const c = text[i];

      if (inQuotes){
        if (c === '"'){
          if (text[i + 1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === ","){ row.push(field); field = ""; i++; continue; }
        if (c === "\r"){ i++; continue; }
        if (c === "\n"){ row.push(field); out.push(row); field = ""; row = []; i++; continue; }
        field += c; i++; continue;
      }
    }
    row.push(field);
    out.push(row);
    return out;
  }

  function buildIndex(headers){
    const map = new Map();
    headers.forEach((h, idx) => map.set(String(h ?? "").trim(), idx));
    return map;
  }

  function getCell(row, idxMap, key){
    const idx = idxMap.get(key);
    if (idx === undefined) return "";
    return row[idx] ?? "";
  }

  function labelFromArguments(arg){
    const raw = arg?.label;
    return raw ? String(raw).toUpperCase() : "UNKNOWN";
  }

  function buildSearchBlob(r){
    const parts = [];

    for (const k of IMPORTANT_COLUMNS){
      if (k === "arguments" || k === "mna_signal_snippets") continue;
      parts.push(String(r[k] ?? ""));
    }

    if (r._arguments){
      parts.push(String(r._arguments.label ?? ""));
      parts.push(String(r._arguments.summary ?? ""));
      parts.push(String(r._arguments.deal_stage ?? ""));
      parts.push(String(r._arguments.deal_role ?? ""));
      parts.push(String(r._arguments.counterparty ?? ""));
      parts.push(String(r._arguments.agent_analyst_comment ?? ""));
      const reasons = Array.isArray(r._arguments.reasons) ? r._arguments.reasons : [];
      for (const rr of reasons){
        parts.push(String(rr?.text ?? ""));
        parts.push(String(rr?.source_url ?? ""));
      }
      const sources = Array.isArray(r._arguments.sources) ? r._arguments.sources : [];
      for (const ss of sources){
        parts.push(String(ss?.title ?? ""));
        parts.push(String(ss?.url ?? ""));
        parts.push(String(ss?.why ?? ""));
      }
    }

    if (r._mna){
      parts.push(String(r._mna.website ?? ""));
      parts.push(String(r._mna.base_root ?? ""));
      parts.push(String(r._mna.company_name ?? ""));
      const msrc = Array.isArray(r._mna.sources) ? r._mna.sources : [];
      for (const s of msrc){
        parts.push(String(s?.title ?? ""));
        parts.push(String(s?.final_url ?? s?.requested_url ?? ""));
        parts.push(String(s?.source_type ?? ""));
      }
    }

    return parts.join(" ").toLowerCase();
  }

  function cardHTML(r){
    const company = String(r.company_name ?? "").trim() || "(missing company_name)";
    const hot = r._hot_score;
    const pri = r._company_priority;

    const label = r._label || "UNKNOWN";
    const labelClass = `label-${label}`;

    const website = normalizeUrl(r.norm_company_website);
    const linkedin = normalizeUrl(r.norm_company_linkedin);

    const published = boolish(r.is_published_on_origin);
    const publishedTxt = published === null ? "" : (published ? "Yes" : "No");
    const originId = String(r.origin_id ?? "").trim();
    const originCompanyUrl = originId ? `https://origin.dialecticanet.com/companies/${encodeURIComponent(originId)}` : "";


    const hotPct = Math.round(clamp01(hot ?? 0) * 100);
    const priPct = Math.round(clamp01(pri ?? 0) * 100);

    const args = r._arguments;
    const reasons = Array.isArray(args?.reasons) ? args.reasons : [];
    const sources = Array.isArray(args?.sources) ? args.sources : [];

    const mna = r._mna;
    const mnaSources = Array.isArray(mna?.sources) ? mna.sources : [];

    const reasonHTML = reasons.length
      ? `<ul class="list">${
          reasons.map(x => {
            const t = esc(x?.text ?? "");
            const u = String(x?.source_url ?? "").trim();
            const link = u ? ` <a href="${esc(u)}" target="_blank" rel="noopener">source</a>` : "";
            return `<li>${t}${link}</li>`;
          }).join("")
        }</ul>`
      : `<div class="small">No reasons provided.</div>`;

    const sourceHTML = sources.length
      ? `<div class="src-grid">${
          sources.map(s => {
            const url = String(s?.url ?? "").trim();
            const title = String(s?.title ?? "").trim() || url || "(source)";
            const why = String(s?.why ?? "").trim();
            const safeUrl = url ? esc(url) : "";
            return `
              <div class="src-item">
                <div class="src-title">
                  ${url ? `<a href="${safeUrl}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title)}
                </div>
                ${why ? `<div class="src-why">${esc(why)}</div>` : `<div class="src-why">—</div>`}
              </div>
            `;
          }).join("")
        }</div>`
      : `<div class="small">No sources provided.</div>`;

    const mnaSourcesHTML = mnaSources.length
      ? `<div class="src-grid">${
          mnaSources.map(s => {
            const url = String(s?.final_url ?? s?.requested_url ?? "").trim();
            const title = String(s?.title ?? "").trim() || url || "(source)";
            const meta = [
              s?.status != null ? `status ${s.status}` : "",
              s?.source_type ? String(s.source_type) : ""
            ].filter(Boolean).join(" · ");
            return `
              <div class="src-item">
                <div class="src-title">
                  ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title)}
                </div>
                <div class="src-why">${esc(meta || "—")}</div>
              </div>
            `;
          }).join("")
        }</div>`
      : `<div class="small">No sources in mna_signal_snippets.</div>`;

    const argsSummary = String(args?.summary ?? "").trim();
    const analyst = String(args?.agent_analyst_comment ?? "").trim();
    const dateline = fmtDate(r.transaction_date) || "Date not disclosed";

    const deckText =
      argsSummary ||
      analyst ||
      [
        r.hq ? `Headquartered in ${String(r.hq).trim()}` : "",
        r.industry_proxi ? `active in ${String(r.industry_proxi).trim()}` : "",
        r.transaction_type ? `with a ${String(r.transaction_type).trim()} context` : ""
      ].filter(Boolean).join(", ") ||
      "Profile assembled from source-linked signals and model annotations.";

    const bodyBits = [
      r.hq ? `HQ: ${esc(r.hq)}` : "",
      r.ownership ? `Ownership: ${esc(r.ownership)}` : "",
      r.industry_proxi ? `Industry: ${esc(r.industry_proxi)}` : "",
      r.fte ? `FTE: ${esc(r.fte)}` : "",
      r.transaction_type ? `Transaction type: ${esc(r.transaction_type)}` : ""
    ].filter(Boolean);

    const bodyLine = bodyBits.length ? bodyBits.join(" · ") : "Core company descriptors are limited in the current record.";
    const quoteText = String(reasons[0]?.text ?? "").trim();
    const closingLine = label === "UNKNOWN"
      ? "Classification remains provisional pending additional evidence."
      : `Current classification: ${esc(label)}.`;

    return `
      <div class="card">
        <div class="card-head">
          <div class="titleblock">
            <div class="dateline">${esc(dateline)}</div>
            <div class="title-row">
              <h2 class="company">${esc(company)}</h2>
              <div class="badges">
                <span class="badge ${esc(labelClass)}">${esc(label)}</span>
              </div>
            </div>
            <div class="deck">${esc(deckText)}</div>
          </div>

          <div class="links">
            <div class="data-callout">
              <div class="k">Data callout</div>
              <div class="v">Hot score ${hot == null ? "—" : esc(fmtNum(hot, 3))} · Priority ${pri == null ? "—" : esc(fmtNum(pri, 3))}</div>
            </div>
            <div class="links-group">
              ${website ? `<a class="chip" href="${esc(website)}" target="_blank" rel="noopener">Website</a>` : ""}
              ${linkedin ? `<a class="chip" href="${esc(linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
              <a class="chip" href="${esc(CSV_URL)}" target="_blank" rel="noopener">CSV</a>
            </div>
          </div>
        </div>

        <div class="narrative">
          <div class="body-copy">${bodyLine}</div>
          ${quoteText ? `<div class="pull-quote">${esc(quoteText)}</div>` : ""}
          <div class="closing-line">${closingLine}</div>
        </div>

        <div class="kv">
          <div class="kv-item"><div class="kv-k">Industry L1</div><div class="kv-v">${esc(r.l1_proxi || "—")}</div></div>
          <div class="kv-item"><div class="kv-k">Industry L2</div><div class="kv-v">${esc(r.industry_proxi || "—")}</div></div>
          <div class="kv-item"><div class="kv-k">FTE</div><div class="kv-v">${esc(r.fte || "—")}</div></div>
          <div class="kv-item"><div class="kv-k">FTE growth</div><div class="kv-v">${r.fte_growth ? fmtNum(asNum(r.fte_growth) * 100, 2) + '%' : "—"}</div></div>
          <div class="kv-item"><div class="kv-k">MENTIONED AS COMP.</div><div class="kv-v">${esc(r.n_competitors || "—")}</div></div>
          <div class="kv-item"><div class="kv-k">Project index</div><div class="kv-v">${r.n_project_index ? fmtNum(asNum(r.n_project_index), 2) : "—"}</div></div>

          <div class="kv-item"><div class="kv-k">Transaction date</div><div class="kv-v">${esc(r.transaction_date || "—")}</div></div>
          <div class="kv-item"><div class="kv-k">Transaction type</div><div class="kv-v">${esc(r.transaction_type || "—")}</div></div>
          <div class="kv-item"><div class="kv-k">AI surveys</div><div class="kv-v">${esc(r.n_ai_survey || "—")}</div></div>
          <div class="kv-item"><div class="kv-k">Max AI score</div><div class="kv-v">${esc(r.max_ai_survey_score || "—")}</div></div>
          <div class="kv-item">
            <div class="kv-k">Published on Origin</div>
            <div class="kv-v">${
              (published === true && originCompanyUrl)
                ? `<a href="${esc(originCompanyUrl)}" target="_blank" rel="noopener">Yes</a>`
                : esc(publishedTxt || "—")
            }</div>
          </div>

          <div class="kv-item"><div class="kv-k">PA batch</div><div class="kv-v">${esc(r.pa_batch || "—")}</div></div>
        </div>

        <div class="bars">
          <div class="barbox">
            <div class="bar-top">
              <div class="bar-k">hot_score</div>
              <div class="bar-v">${hot == null ? "—" : esc(fmtNum(hot, 3))} (${hotPct}%)</div>
            </div>
            <div class="bar"><div class="bar-fill teal" style="width:${hotPct}%;"></div></div>
          </div>

          <div class="barbox">
            <div class="bar-top">
              <div class="bar-k">COMPANY PRIORITY</div>
              <div class="bar-v">${pri == null ? "—" : esc(fmtNum(pri, 3))} (${priPct}%)</div>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${priPct}%;"></div></div>
          </div>
        </div>

        <details class="section" open>
          <summary>
            <span>Arguments (model output)</span>
            <span class="small">Stage: ${esc(args?.deal_stage ?? "—")}</span>
          </summary>
          <div class="section-body">
            ${argsSummary ? `<div class="small">Summary: ${esc(argsSummary)}</div>` : `<div class="small">Summary: —</div>`}
            ${analyst ? `<div class="small" style="margin-top:6px;">Analyst agent comment: ${esc(analyst)}</div>` : ""}

            <div class="chips">
              <span class="mini">deal_role: ${esc(args?.deal_role ?? "—")}</span>
              <span class="mini">deal_date: ${esc(args?.deal_date ?? "—")}</span>
              <span class="mini">counterparty: ${esc(args?.counterparty ?? "—")}</span>
            </div>

            <div class="subhead">Reasons</div>
            ${reasonHTML}

            <div class="subhead">Sources</div>
            ${sourceHTML}
          </div>
        </details>

        <details class="section">
          <summary>
            <span>M&A signal snippets</span>
            <span class="small">${esc(mna?.website ?? "")}</span>
          </summary>
          <div class="section-body">
            <div class="small">
              ${mna?.base_root ? `Base: ${esc(mna.base_root)} &nbsp;·&nbsp; ` : ""}
              ${mna?.retrieved_at_utc ? `Retrieved: ${esc(mna.retrieved_at_utc)}` : ""}
            </div>

            <div class="subhead">Sources</div>
            ${mnaSourcesHTML}
          </div>
        </details>
      </div>
    `;
  }

  function render(){
    cardsEl.innerHTML = "";

    const showN = Math.min(renderLimit, filtered.length);
    const slice = filtered.slice(0, showN);

    cardsEl.innerHTML = slice.map(cardHTML).join("");

    metaEl.textContent =
      `Companies: ${filtered.length.toLocaleString()} / ${all.length.toLocaleString()} | Showing: ${showN.toLocaleString()} | Sorted: hot_score ↓, company_priority_test ↓`;

    if (showN < filtered.length){
      loadMoreWrap.style.display = "flex";
      loadMoreBtn.textContent = `Load more (${Math.min(RENDER_STEP, filtered.length - showN)})`;
    } else {
      loadMoreWrap.style.display = "none";
    }
  }

  function applyFilter(){
    const needle = qEl.value.trim().toLowerCase();
    renderLimit = 40;

    if (!needle){
      filtered = all;
    } else {
      filtered = all.filter(r => r._search.includes(needle));
    }
    render();
  }

  loadMoreBtn.addEventListener("click", () => {
    renderLimit += RENDER_STEP;
    render();
  });

  clearBtn.addEventListener("click", () => {
    qEl.value = "";
    applyFilter();
    qEl.focus();
  });

  qEl.addEventListener("input", () => applyFilter());

  async function fetchFirstOk(urls){
    let lastErr = null;
    for (const u of urls){
      try{
        const r = await fetch(u, { cache: "no-store" });
        if (r.ok) return { url: u, res: r };
        lastErr = new Error(`Fetch failed: ${r.status} ${r.statusText} (${u})`);
      } catch (e){
        lastErr = e;
      }
    }
    throw lastErr || new Error("Failed to fetch CSV.");
  }

  async function main(){
    try{
      clearError();
      setStatus("Locating CSV…");

      const { url, res } = await fetchFirstOk(CSV_CANDIDATES);
      CSV_URL = url;

      srcLink.href = CSV_URL;
      srcLink.textContent = CSV_URL;

      setStatus("Downloading CSV…");
      const text = await res.text();
      if (!text.trim()) throw new Error("CSV appears empty.");

      setStatus("Parsing…");
      const parsed = parseCSV(text);
      if (!parsed.length) throw new Error("CSV appears empty.");

      const headers = parsed[0].map(h => String(h ?? "").trim());
      const idxMap = buildIndex(headers);

      const records = [];
      for (const row of parsed.slice(1)){
        const r = {};
        for (const k of IMPORTANT_COLUMNS){
          r[k] = getCell(row, idxMap, k);
        }

        r._arguments = safeJsonParse(r.arguments);
        r._mna = safeJsonParse(r.mna_signal_snippets);

        r._label = labelFromArguments(r._arguments);

        r._hot_score = asNum(r.hot_score);
        r._company_priority = asNum(r.company_priority_test);

        r._search = buildSearchBlob(r);

        records.push(r);
      }

      records.sort((a, b) => {
        const ah = (a._hot_score == null) ? -Infinity : a._hot_score;
        const bh = (b._hot_score == null) ? -Infinity : b._hot_score;
        if (bh !== ah) return bh - ah;

        const ap = (a._company_priority == null) ? -Infinity : a._company_priority;
        const bp = (b._company_priority == null) ? -Infinity : b._company_priority;
        if (bp !== ap) return bp - ap;

        const an = String(a.company_name ?? "");
        const bn = String(b.company_name ?? "");
        return an.localeCompare(bn);
      });

      all = records;
      filtered = all;

      setStatus("Ready");
      render();

    } catch (e){
      setStatus("Error");
      showError(String(e?.message || e));
    }
  }

  main();
})();
</script>
</body>
</html>
